---
- name: Create the initial application release
  hosts: webservers
  become: true
  gather_facts: false

  tasks:
    - name: Create application release directory
      ansible.builtin.file:
        path: /opt/myapp/releases/1.0.0
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create initial application page
      ansible.builtin.copy:
        dest: /opt/myapp/releases/1.0.0/index.html
        content: |
          Application: MyTrainingApp
          Version: 1.0.0
          Status: Working
        owner: root
        group: root
        mode: "0644"

    - name: Set the current release to version 1.0.0
      ansible.builtin.file:
        src: /opt/myapp/releases/1.0.0
        dest: /opt/myapp/current
        state: link
        force: true

    - name: Verify the initial release
      ansible.builtin.command:
        cmd: cat /opt/myapp/current/index.html
      register: initial_page
      changed_when: false

    - name: Display the initial release
      ansible.builtin.debug:
        var: initial_page.stdout_lines

