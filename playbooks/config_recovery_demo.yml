---
- name: Application configuration recovery demo
  hosts: webservers
  become: true
  gather_facts: false

  tasks:

    - name: Configuration validation and recovery
      block:

        - name: Simulate missing configuration on node2
          ansible.builtin.file:
            path: /opt/MyTrainingApp/rollback-demo.properties
            state: absent
          when: inventory_hostname == "node2"

        - name: Check application configuration
          ansible.builtin.stat:
            path: /opt/MyTrainingApp/rollback-demo.properties
          register: app_config

        - name: Validate configuration exists
          ansible.builtin.assert:
            that:
              - app_config.stat.exists
              - app_config.stat.isreg
            fail_msg: "Configuration missing on {{ inventory_hostname }}"

      rescue:

        - name: Restore previous configuration
          ansible.builtin.copy:
            src: /opt/MyTrainingApp/rollback-demo.properties.backup
            dest: /opt/MyTrainingApp/rollback-demo.properties
            remote_src: true

        - name: Verify restored configuration
          ansible.builtin.stat:
            path: /opt/MyTrainingApp/rollback-demo.properties
          register: restored_config

        - name: Calculate restored configuration checksum
          ansible.builtin.stat:
            path: /opt/MyTrainingApp/rollback-demo.properties
            checksum_algorithm: sha256
          register: restored_checksum

        - name: Calculate backup checksum
          ansible.builtin.stat:
            path: /opt/MyTrainingApp/rollback-demo.properties.backup
            checksum_algorithm: sha256
          register: backup_checksum

        - name: Verify restored configuration matches backup
          ansible.builtin.assert:
            that:
              - restored_checksum.stat.checksum == backup_checksum.stat.checksum
            success_msg: "Restored configuration matches backup on {{ inventory_hostname }}"
            fail_msg: "Restored configuration does not match backup on {{ inventory_hostname }}"

        - name: Confirm recovery
          ansible.builtin.assert:
            that:
              - restored_config.stat.exists
              - restored_config.stat.isreg
            success_msg: "Configuration successfully restored on {{ inventory_hostname }}"

      always:

        - name: Record recovery execution
          ansible.builtin.debug:
            msg: "Configuration recovery workflow completed on {{ inventory_hostname }}"
