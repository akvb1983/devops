---
- name: Deploy Flask Application
  hosts: webservers
  become: true

  tasks:

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/employee-portal
        state: directory

    - name: Copy application
      ansible.builtin.copy:
        src: ../app/app.py
        dest: /opt/employee-portal/app.py

    - name: Copy requirements file
      ansible.builtin.copy:
        src: ../app/requirements.txt
        dest: /opt/employee-portal/requirements.txt

    - name: Execute deployment script
      ansible.builtin.script:
        cmd: ../scripts/deploy.sh

    - name: Install Python packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
        state: present
        update_cache: true

    - name: Install Flask package
      ansible.builtin.apt:
        name: python3-flask
        state: present
        update_cache: true

    - name: Run Flask App
      ansible.builtin.shell: |
        nohup python3 /opt/employee-portal/app.py \
        > /opt/employee-portal/app.log 2>&1 &
