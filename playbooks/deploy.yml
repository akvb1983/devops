---
- name: Deploy Flask Application
  hosts: webservers
  become: true

  vars:
    app_dir: /opt/employee-portal

  tasks:

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy application
      ansible.builtin.copy:
        src: ../app/app.py
        dest: "{{ app_dir }}/app.py"
        mode: '0755'

    - name: Copy requirements file
      ansible.builtin.copy:
        src: ../app/requirements.txt
        dest: "{{ app_dir }}/requirements.txt"

    - name: Install Python packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-flask
        state: present
        update_cache: true


    - name: Stop existing Flask application
      ansible.builtin.shell: |
        pkill -9 -f "/opt/employee-portal/app.py" || true
      changed_when: false
      failed_when: false

    - name: Start Flask application
      ansible.builtin.shell: |
        nohup python3 {{ app_dir }}/app.py \
        > {{ app_dir }}/app.log 2>&1 &
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for application startup
      ansible.builtin.wait_for:
        port: 5000
        timeout: 30

    - name: Verify application health
      ansible.builtin.uri:
        url: http://localhost:5000
        return_content: true
      register: health_check

    - name: Display application response
      ansible.builtin.debug:
        msg: "{{ health_check.content }}"
