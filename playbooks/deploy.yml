---
- name: Deploy Flask Application
  hosts: webservers
  become: true

  vars:
  releases_dir: /opt/releases
  current_dir: /opt/current
  app_dir: /opt/employee-portal
  release_version: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"


  tasks:

    - name: Create release directory
      file:
        path: "/opt/releases/{{ release_version }}"
        state: directory

    - name: Copy application
      ansible.builtin.copy:
        src: ../app/app.py
        dest: "{{ releases_dir }}/{{ release_version }}/app.py"

    - name: Copy requirements file
      ansible.builtin.copy:
        src: ../app/requirements.txt
        dest: "{{ releases_dir }}/{{ release_version }}/requirements.txt"

    - name: Update current symlink
      file:
        src: "{{ releases_dir }}/{{ release_version }}"
        dest: "{{ current_dir }}"
        state: link
        force: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy application
      ansible.builtin.copy:
        src: ../app/app.py
        dest: "{{ app_dir }}/app.py"
        mode: '0755'

    - name: Copy requirements file
      ansible.builtin.copy:
        src: ../app/requirements.txt
        dest: "{{ app_dir }}/requirements.txt"

    - name: Install Python packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-flask
        state: present
        update_cache: true


    - name: Stop existing Flask application
      ansible.builtin.shell: |
        pkill -9 -f "/opt/current/app.py" || true
      changed_when: false
      failed_when: false

    - name: Start Flask application
      ansible.builtin.shell: |
        nohup python3 {{ current_dir }}/app.py \
        > {{ current_dir }}/app.log 2>&1 &
      args:
        chdir: "{{ current_dir }}"

    - name: Wait for application startup
      ansible.builtin.wait_for:
        port: 5000
        timeout: 30

    - name: Verify application health
      ansible.builtin.uri:
        url: http://localhost:5000
        return_content: true
      register: health_check

    - name: Display application response
      ansible.builtin.debug:
        msg: "{{ health_check.content }}"
