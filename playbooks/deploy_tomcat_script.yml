---
- name: Install, configure, and start Tomcat 10 without systemd
  hosts: webservers
  become: true

  vars:
    tomcat_script_path: /usr/local/bin/manage-tomcat10.sh
    tomcat_user: tomcat

  tasks:
    - name: Ensure Tomcat 10 is installed
      ansible.builtin.apt:
        name: tomcat10
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy Tomcat 10 control script to managed nodes
      ansible.builtin.copy:
        dest: "{{ tomcat_script_path }}"
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          set -e

          ACTION="${1:-status}"
          TOMCAT_USER="tomcat"

          run_as_tomcat() {
            su -s /bin/bash "$TOMCAT_USER" -c "
              set -a
              [ -f /etc/default/tomcat10 ] && . /etc/default/tomcat10
              export CATALINA_HOME=/usr/share/tomcat10
              export CATALINA_BASE=/var/lib/tomcat10
              export CATALINA_TMPDIR=/tmp
              /usr/share/tomcat10/bin/catalina.sh $1
            "
          }

          case "$ACTION" in
            start)
              if pgrep -f '[c]atalina' >/dev/null; then
                echo "Tomcat 10 is already running."
                exit 0
              fi
              run_as_tomcat start
              ;;
            stop)
              if ! pgrep -f '[c]atalina' >/dev/null; then
                echo "Tomcat 10 is already stopped."
                exit 0
              fi
              echo "Stopping Tomcat 10..."
              pkill -15 -f '[c]atalina'
              for i in {1..15}; do
                if ! pgrep -f '[c]atalina' >/dev/null; then
                  echo "Tomcat 10 stopped."
                  exit 0
                fi
                sleep 1
              done
              echo "Tomcat did not stop gracefully, forcing kill..."
              pkill -9 -f '[c]atalina' || true
              echo "Tomcat 10 stopped."
              ;;
            restart)
              $0 stop
              $0 start
              ;;
            status)
              if pgrep -af '[c]atalina'; then
                echo "Tomcat 10 is RUNNING."
                exit 0
              else
                echo "Tomcat 10 is STOPPED."
                exit 1
              fi
              ;;
            *)
              echo "Usage: $0 {start|stop|restart|status}"
              exit 2
              ;;
          esac

    - name: Ensure Tomcat 10 is started (Idempotent)
      ansible.builtin.command: "{{ tomcat_script_path }} start"
      register: tomcat_start_out
      changed_when: "'Tomcat started.' in tomcat_start_out.stdout"

