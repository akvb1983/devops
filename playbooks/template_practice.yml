---
- name: Deploy Application configuration using Jinja2 template.
  hosts: webservers
  become: true

  tasks:
    - name: Generate application properties file.
      ansible.builtin.template:
        src: ../templates/app.properties.j2
        dest: "/opt/{{app_name}}/app.properties"
        owner: "{{app_owner}}"
        group: "{{app_group}}"
        mode: "{{app_mode}}"
