---
  - name: Create Directories using loop.
    hosts: webservers
    become: true
    gather_facts: false

    tasks:
      - name: Create required Application Directories.
        ansible.builtin.file:
          path: "{{item}}"
          state: directory
          owner: root
          group: root
          mode: "0755"
        loop:
          - /opt/myapp
          - /opt/myapp/releases
          - /opt/myapp/logs
          - /opt/myapp/backups
