---
- name: Demostrate Ansible listen with Tomcat 10.
  hosts: webservers
  become: true

  vars:
    tomcat_script_path: /usr/local/bin/manage-tomcat10.sh

  tasks:
    - name: Deploy configuration changes.
      ansible.builtin.template:
        src: ../templates/tomcat-handler-demo.j2
        dest: "/opt/{{app_name}}/tomcat-handler-demo.properties"
        owner: "{{app_owner}}"
        group: "{{app_group}}"
        mode: '0644'
      notify: application_configuration_changed

    - name: Execute pending handlers before verification.
      ansible.builtin.meta: flush_handlers

    - name: Verify Tomcat 10 status.
      ansible.builtin.command:
        cmd: "{{tomcat_script_path}} status"
      register: tomcat_status
      changed_when: false
      failed_when: tomcat_status.rc !=0

    - name: Display Tomcat 10 status.
      ansible.builtin.debug:
        msg: "{{tomcat_status.stdout_lines}}"

  handlers:
    - name: Restart Tomcat 10.
      listen: application_configuration_changed
      ansible.builtin.command:
        cmd: "{{tomcat_script_path}} restart"
      changed_when: true

    - name: Record Tomcat 10 restart event.
      listen: application_configuration_changed
      ansible.builtin.shell:
        cmd: "echo \"Tomcat 10 restart Triggered by Ansible at $(date)\" >> /var/log/ansible-tomcat.log"
      changed_when: true
