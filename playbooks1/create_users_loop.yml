---
  - name: Create application support users.
    hosts: webservers
    become: true
    gather_facts: false

    tasks:
      - name: Create required users.
        ansible.builtin.user:
          name: "{{item}}"
          state: present
          create_home: true
          shell: /bin/bash
        loop:
          - appsupport
          - deploysvc
