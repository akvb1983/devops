---
  - name: Create directories with their individual settings.
    hosts: webservers
    become: true
    gather_facts: false

    vars:
      app_directories:
        - path: /opt/myapp/config
          owner: root
          group: root
          mode: "0750"

        - path: /opt/myapp/data
          owner: root
          group: root
          mode: "0750"

        - path: /opt/myapp/logs
          owner: root
          group: root
          mode: "0750"

    tasks:
      - name: Create directories with their defined properties.
        ansible.builtin.file:
          path: "{{ item.path }}"
          state: directory
          owner: "{{ item.owner }}"
          group: "{{ item.group }}"
          mode: "{{ item.mode }}"

        loop: "{{ app_directories }}"

