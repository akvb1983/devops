---
- name: Demonstrate Ansible tags
  hosts: webservers
  become: true
  gather_facts: false

  vars:
    app_name: MyTrainingApp
    app_version: "3.0.0"
    app_directory: /opt/myapp

  tasks:

    - name: Display target server
      ansible.builtin.debug:
        msg: "Executing selected tasks on {{ inventory_hostname }}"
      tags:
        - always

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        mode: "0755"
      tags:
        - setup
        - deploy

    - name: Deploy application version 3.0.0
      ansible.builtin.copy:
        dest: "{{ app_directory }}/index.html"
        content: |
          Application: {{ app_name }}
          Version: {{ app_version }}
          Server: {{ inventory_hostname }}
          Status: Working
        mode: "0644"
      tags:
        - deploy

    - name: Validate deployed application version
      ansible.builtin.command:
        cmd: "grep -F -q 'Version: {{ app_version }}' {{ app_directory }}/index.html"
      changed_when: false
      tags:
        - validate

    - name: Roll back application to version 2.0.0
      ansible.builtin.copy:
        dest: "{{ app_directory }}/index.html"
        content: |
          Application: {{ app_name }}
          Version: 2.0.0
          Server: {{ inventory_hostname }}
          Status: Working
        mode: "0644"
      tags:
        - never
        - rollback
