---
 - name: Install and Start Apache Webserver on Debian and RedHat system based servers.
   hosts: webservers
   gather_facts: true
   become: true

   tasks:
    - name: Install Apache on Debian based servers.
      ansible.builtin.apt:
       name: apache2
       state: present
       update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Apache on RedHat based servers.
      ansible.builtin.dnf:
       name: httpd
       state: present
       update_cache: true
      when: ansible_facts['os_family'] == "RedHat"

    - name: Ensure Apache Web Service is running.
      ansible.builtin.service:
       name: "{{ 'apache2' if ansible_facts['os_family'] == 'Debian' else 'httpd' }}"
       state: started
       enabled: true
