---
- name: Demonstrate Ansible Vault variables
  hosts: webservers
  gather_facts: false

  # Load the inline vault string variables from your separate file
  vars_files:
    - vault_demo_string.yml

  tasks:
    - name: Check that the database username is available
      ansible.builtin.assert:
        that:
          - vault_db_username is defined
          - vault_db_username | length > 0
        success_msg: "Database username is available."

    - name: Check that the database password is available
      ansible.builtin.assert:
        that:
          - vault_db_password is defined
          - vault_db_password | length > 0
        success_msg: "Database password is available."

    - name: Check that the inline vault service password is available
      ansible.builtin.assert:
        that:
          - vault_service_password is defined
          - vault_service_password | length > 0
        success_msg: "Service password is available."

    - name: Display safe application information
      ansible.builtin.debug:
        msg:
          - "Environment: {{ vault_app_environment }}"
          - "App Name: {{ app_name }} (Port: {{ app_port }})"
          - "Username: {{ vault_db_username }}"
          - "Database password: [HIDDEN]"
          - "Service password: [HIDDEN]"
          - "API token: [HIDDEN]"
