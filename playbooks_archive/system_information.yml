---
- name: Collect system information from webservers

  hosts: webservers
  gather_facts: yes

  tasks:

    - name: Display hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ ansible_hostname }}"

    - name: Display operating system
      ansible.builtin.debug:
        msg: "Operating System: {{ ansible_distribution }}"

    - name: Display OS version
      ansible.builtin.debug:
        msg: "OS Version: {{ ansible_distribution_version }}"

    - name: Display processor count
      ansible.builtin.debug:
        msg: "CPU Cores: {{ ansible_processor_vcpus }}"

    - name: Display total memory
      ansible.builtin.debug:
        msg: "Total Memory: {{ ansible_memtotal_mb }} MB"

    - name: Display IP address
      ansible.builtin.debug:
        msg: >-
          IP Address:
          {{
            ansible_default_ipv4.address
            | default(ansible_all_ipv4_addresses | first | default('Not detected'))
          }}
