---
- name: Manage middleware services
  hosts: webservers
  become: true
  gather_facts: false

  vars:
    middleware_services:
      - name: apache2
        desired_state: started
        enabled_at_boot: true

      - name: ssh
        desired_state: started
        enabled_at_boot: true

  tasks:
    - name: Ensure middleware services are in desired state
      ansible.builtin.service:
        name: "{{ item.name }}"
        state: "{{ item.desired_state }}"
        enabled: "{{ item.enabled_at_boot }}"
      loop: "{{ middleware_services }}"

