
---
- name: Rolling deployment with automatic rollback
  hosts: webservers
  become: true

  serial: 1
  max_fail_percentage: 0

  vars:
    app_config: /opt/MyTrainingApp/rollback-demo.properties
    backup_config: /opt/MyTrainingApp/rollback-demo.properties.rolling-backup

  tasks:

    - name: Deploy application with rollback protection

      block:

        - name: Backup existing application configuration
          ansible.builtin.copy:
            src: "{{ app_config }}"
            dest: "{{ backup_config }}"
            remote_src: true
            owner: ansible
            group: ansible
            mode: '0644'

        - name: Deploy application version 2.0
          ansible.builtin.copy:
            content: |
              application=MyTrainingApp
              version=2.0
              deployment_status=NEW
            dest: "{{ app_config }}"
            owner: ansible
            group: ansible
            mode: '0644'

        - name: Validate deployed application version
          ansible.builtin.command:
            cmd: "grep -q '^version=2.0$' {{ app_config }}"
          changed_when: false

        - name: Simulate validation failure on node2
          ansible.builtin.command:
            cmd: /bin/false
          when: inventory_hostname == "node2"

        - name: Confirm deployment success
          ansible.builtin.debug:
            msg: "Version 2.0 deployed successfully on {{ inventory_hostname }}."

      rescue:

        - name: Restore previous application configuration
          ansible.builtin.copy:
            src: "{{ backup_config }}"
            dest: "{{ app_config }}"
            remote_src: true
            owner: ansible
            group: ansible
            mode: '0644'

        - name: Verify restored configuration
          ansible.builtin.command:
            cmd: "grep -q 'version=1.0' {{ app_config }}"
          changed_when: false

        - name: Stop rollout after deployment failure
          ansible.builtin.fail:
            msg: "Deployment failed on {{ inventory_hostname }}. Previous version restored. Stopping rollout."

      always:

        - name: Record deployment cycle completion
          ansible.builtin.debug:
            msg: "Deployment cycle completed on {{ inventory_hostname }}."

