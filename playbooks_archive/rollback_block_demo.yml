---
- name: Application deployment with configuration rollback.
  hosts: webservers
  become: true

  vars:
    app_config_path: /opt/{{app_name}}/rollback-demo.properties
    app_backup_config_path: /opt/{{app_name}}/rollback-demo.properties.backup

  tasks:
    - name: Demostrate application deployment with rollback protection.

      block:
        - name: Backup existing configuration.
          ansible.builtin.copy:
            src: "{{app_config_path}}"
            dest: "{{app_backup_config_path}}"
            remote_src: true
            owner: "{{app_owner}}"
            group: "{{app_group}}"
            mode: '0644'

        - name: Deploy application version 2.0.
          ansible.builtin.copy:
            content: |
              'application="{{app_name}}"
               version=2.0
               deployment_status=NEW'
            dest: "{{app_config_path}}"
            owner: "{{app_owner}}"
            group: "{{app_group}}"
            mode: '0644'

        - name: Display deployed application version 2.0.
          ansible.builtin.command:
            cmd: "cat {{app_config_path}}"
          register: deployed_config
          changed_when: false

        - name: Show version 2.0 configuration.
          ansible.builtin.debug:
            var: deployed_config.stdout_lines


        - name: Simulate deployment validation failure.
          ansible.builtin.command:
            cmd: /bin/false

        - name: Confirm deployment success.
          ansible.builtin.debug:
            msg: "Version 2.0 Deployment Successfull."

      rescue:
        - name: Restore previous application configuration.
          ansible.builtin.copy:
            src: "{{app_backup_config_path}}"
            dest: "{{app_config_path}}"
            remote_src: true
            owner: "{{app_owner}}"
            group: "{{app_group}}"
            mode: '0644'
        
        - name: Display rollback result.
          ansible.builtin.debug:
            msg: "Deployment of version 2.0 failed. Previous configuration restored."

      always:
        - name: Record final deployment state.
          ansible.builtin.command:
            cmd: "cat {{app_config_path}}"
          register: final_config
          changed_when: false

        - name: Display final configuration.
          ansible.builtin.debug:
            var: final_config.stdout_lines


