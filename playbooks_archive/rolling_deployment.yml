---
- name: Rolling deployment across application servers
  hosts: webservers
  become: true
  gather_facts: false

  serial: 1
  any_errors_fatal: true

  vars:
    app_name: MyTrainingApp
    app_version: "2.0.0"
    app_directory: /opt/myapp

  tasks:
    - name: Display the server being updated
      ansible.builtin.debug:
        msg: "Starting deployment on {{ inventory_hostname }}"

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        mode: "0755"

    - name: Deploy application version
      ansible.builtin.copy:
        dest: "{{ app_directory }}/index.html"
        content: |
          Application: {{ app_name }}
          Version: {{ app_version }}
          Server: {{ inventory_hostname }}
          Status: Working
        mode: "0644"

    - name: Validate deployed application version
      ansible.builtin.command:
        cmd: "grep -F -q 'Version: {{ app_version }}' {{ app_directory }}/index.html"
      changed_when: false

    - name: Display deployment success
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} successfully deployed {{ app_version }}"
